<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Commonwealth Bank data science simulation workflow</title>
  <desc id="desc">Four sequential tasks: transaction analysis, data anonymisation, social media insights, and database design.</desc>
  <defs>
    <style>
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:2}.h{font:700 16px Arial,sans-serif;fill:#0F172A}.p{font:12px Arial,sans-serif;fill:#475569}.n{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="960" height="250" rx="18" fill="#F8FAFC"/>
  <g transform="translate(18 32)">
    <rect class="card" width="210" height="160" rx="13"/>
    <circle cx="30" cy="30" r="17" fill="#217346"/><text class="n" x="30" y="34" text-anchor="middle">01</text>
    <text class="h" x="20" y="76">Data aggregation</text><text class="p" x="20" y="101">Transactions · formulas</text><text class="p" x="20" y="120">PivotTable reconciliation</text>
  </g>
  <path d="M232 112h17m-6-6 6 6-6 6" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(252 32)">
    <rect class="card" width="210" height="160" rx="13"/>
    <circle cx="30" cy="30" r="17" fill="#4F46E5"/><text class="n" x="30" y="34" text-anchor="middle">02</text>
    <text class="h" x="20" y="76">Data anonymisation</text><text class="p" x="20" y="101">Minimisation · generalisation</text><text class="p" x="20" y="120">Disclosure-risk checks</text>
  </g>
  <path d="M466 112h17m-6-6 6 6-6 6" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(486 32)">
    <rect class="card" width="210" height="160" rx="13"/>
    <circle cx="30" cy="30" r="17" fill="#2563EB"/><text class="n" x="30" y="34" text-anchor="middle">03</text>
    <text class="h" x="20" y="76">Social insights</text><text class="p" x="20" y="101">Sentiment · engagement</text><text class="p" x="20" y="120">API review · proposal</text>
  </g>
  <path d="M700 112h17m-6-6 6 6-6 6" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(720 32)">
    <rect class="card" width="210" height="160" rx="13"/>
    <circle cx="30" cy="30" r="17" fill="#475569"/><text class="n" x="30" y="34" text-anchor="middle">04</text>
    <text class="h" x="20" y="76">Database design</text><text class="p" x="20" y="101">Entities · relationships</text><text class="p" x="20" y="120">Schema documentation</text>
  </g>
  <text x="480" y="226" text-anchor="middle" class="p">Learn → validate → document → submit in Forage</text>
</svg>